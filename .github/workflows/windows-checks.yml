name: Windows download checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build PersonalDownloader.csproj -c Release
      - run: dotnet run --project Checks -c Release
      - run: dotnet run --project DesktopChecks -c Release
      - run: node --test Checks/browser.test.cjs
      - run: dotnet publish Desktop/PersonalDownloader.Desktop.csproj -c Release --no-self-contained -o release/PersonalDownloader
